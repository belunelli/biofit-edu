[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "biofit"
version = "0.2.0"
description = "Ajuste generalizado e modelagem inicial de dados de bioprocessos"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Betânia Hoss Lunelli" }]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "matplotlib>=3.5",
]
keywords = ["bioprocess", "kinetics", "curve fitting", "gompertz", "logistic"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
biofit = "biofit.cli:main"

[tool.setuptools]
packages = ["biofit"]
